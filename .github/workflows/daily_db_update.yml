name: Daily Update Products in DB

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  run-db-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt.txt ]; then pip install -r requirements.txt.txt; fi

      - name: Run update_products_in_db.py
        env:
          DB_HOST: ${{ secrets.BI_DB_HOST }}
          DB_USER: ${{ secrets.BI_DB_USER }}
          DB_PASSWORD: ${{ secrets.BI_DB_PASS }}
          DB_NAME: ${{ secrets.BI_DB_NAME }}
          DB_PORT: ${{ secrets.BI_DB_PORT }}
        run: python update_products_in_db.py